server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # A client-side-routed SPA (react-router): any path that isn't a real static file falls
    # back to index.html so a hard refresh on e.g. /teams/<id> doesn't 404 against a server
    # that has no idea what /teams/<id> is - React Router resolves that route once index.html's
    # own JS loads, not nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
