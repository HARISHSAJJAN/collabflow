name: collabflow

services:
  postgres:
    image: postgres:16-alpine
    container_name: collabflow-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-collabflow}
      POSTGRES_USER: ${DB_USER:-collabflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-collabflow}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-collabflow} -d ${DB_NAME:-collabflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [collabflow]

  redis:
    image: redis:7-alpine
    container_name: collabflow-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [collabflow]

  kafka:
    # Single-broker KRaft mode: no separate Zookeeper container, which removes the classic
    # "Kafka starts before Zookeeper is ready" brittleness the project brief warns about.
    # This is a development/single-broker topology - see docs/architecture.md for how a
    # production deployment would run a multi-broker KRaft cluster instead.
    image: apache/kafka:3.9.2
    container_name: collabflow-kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:19093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "Y2VkNGY2YjItY29sbGFi"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks: [collabflow]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: collabflow-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-collabflow}
      DB_USER: ${DB_USER:-collabflow}
      DB_PASSWORD: ${DB_PASSWORD:-collabflow}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-30}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [collabflow]

  # The "frontend" service is deliberately not defined yet: the React/TypeScript/Vite app
  # itself doesn't exist in this repo yet (see README.md - "frontend setup instructions are
  # added once the frontend phase begins"). Adding a service block with a build context that
  # doesn't exist would make `docker compose up` fail outright, which is worse than simply not
  # claiming a capability this repo doesn't have yet. It will be added back here, alongside
  # frontend/Dockerfile, once that phase starts.

networks:
  collabflow:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
